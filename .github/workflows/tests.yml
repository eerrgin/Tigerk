name: Tigerk Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m py_compile ag.py aktivasyon.py denetci.py egitim.py katman.py kayip.py main.py mantik.py noron.py test_tigerk.py tigerk_kur.py tigerk_v0.py ve_kapisi.py xor_kapisi.py
      - name: Run unit tests
        run: python -m unittest test_tigerk -v
      - name: Smoke-test modular demo
        run: python main.py
      - name: Smoke-test single-file teaching example
        run: python tigerk_v0.py
